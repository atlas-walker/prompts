<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>API Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; }
  body { -webkit-font-smoothing: antialiased; }
  table { border-collapse: collapse; }
  pre { margin: 0; }
  #app a { text-decoration: none; }
  @media (max-width: 760px) {
    #app .api-two-col { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script id="controllers-data" type="application/json">
{
  "meta": { "title": "API Reference", "version": "v1", "updated": "09 Aug 2026" },
  "controllers": [
    {
      "name": "Logs",
      "basePath": "/api/v1/logs",
      "description": "Audit and traceability controller. Query, record, correct and purge the events emitted by the platform services. Every record is tied to the acting user and the originating service.",
      "badges": ["Auth · Bearer JWT", "Content-Type · application/json", "Rate limit · 600 req/min", "Pagination · cursor"],
      "endpoints": [
        {
          "method": "GET",
          "path": "/api/v1/logs",
          "summary": "Paginated list of events, filterable by level, service and date range",
          "params": [
            { "name": "level", "in": "query", "type": "enum", "required": false, "description": "DEBUG · INFO · WARN · ERROR · FATAL" },
            { "name": "service", "in": "query", "type": "string", "required": false, "description": "Identifier of the emitting service" },
            { "name": "from", "in": "query", "type": "date-time", "required": true, "description": "Range start, ISO-8601 UTC" },
            { "name": "to", "in": "query", "type": "date-time", "required": true, "description": "Range end, 31 days maximum" },
            { "name": "limit", "in": "query", "type": "integer", "required": false, "description": "1–200, defaults to 50" }
          ],
          "request": "curl -X GET \\\n  '$BASE/api/v1/logs?level=ERROR&from=2026-08-01T00:00:00Z&to=2026-08-09T00:00:00Z&limit=50' \\\n  -H 'Authorization: Bearer $TOKEN'",
          "response": {
            "status": "200",
            "body": "{\n  \"data\": [\n    {\n      \"id\": \"log_8f21c4\",\n      \"level\": \"ERROR\",\n      \"service\": \"billing-api\",\n      \"message\": \"Payment gateway timeout\",\n      \"traceId\": \"b7c1e9a0\",\n      \"createdAt\": \"2026-08-08T14:22:09Z\"\n    }\n  ],\n  \"nextCursor\": \"eyJvZmZzZXQiOjUwfQ==\",\n  \"total\": 1284\n}"
          },
          "statuses": [
            { "code": "200", "description": "Query succeeded" },
            { "code": "400", "description": "Invalid date range" },
            { "code": "401", "description": "Missing or expired token" },
            { "code": "429", "tone": "error", "description": "Rate limit exceeded" }
          ]
        },
        {
          "method": "GET",
          "path": "/api/v1/logs/{id}",
          "summary": "Full detail of a single event, including stack trace and context",
          "params": [
            { "name": "id", "in": "path", "type": "string", "required": true, "description": "Log identifier, prefixed with log_" }
          ],
          "request": "curl -X GET '$BASE/api/v1/logs/log_8f21c4' \\\n  -H 'Authorization: Bearer $TOKEN'",
          "response": {
            "status": "200",
            "body": "{\n  \"id\": \"log_8f21c4\",\n  \"level\": \"ERROR\",\n  \"service\": \"billing-api\",\n  \"message\": \"Payment gateway timeout\",\n  \"context\": { \"orderId\": \"ORD-4471\", \"retries\": 3 },\n  \"stackTrace\": \"java.net.SocketTimeoutException...\",\n  \"traceId\": \"b7c1e9a0\",\n  \"createdAt\": \"2026-08-08T14:22:09Z\"\n}"
          },
          "statuses": [
            { "code": "200", "description": "Event found" },
            { "code": "404", "description": "Unknown identifier" }
          ]
        },
        {
          "method": "POST",
          "path": "/api/v1/logs",
          "summary": "Records a new event, single or in batches of up to 500",
          "body": [
            { "name": "level", "type": "enum", "required": true, "description": "Event severity" },
            { "name": "service", "type": "string", "required": true, "description": "Emitting service, 64 characters max" },
            { "name": "message", "type": "string", "required": true, "description": "Event description, 2,000 characters max" },
            { "name": "context", "type": "object", "required": false, "description": "Free-form metadata, up to 32 keys" },
            { "name": "traceId", "type": "string", "required": false, "description": "Distributed correlation id, generated when omitted" }
          ],
          "request": "curl -X POST '$BASE/api/v1/logs' \\\n  -H 'Authorization: Bearer $TOKEN' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"level\": \"WARN\",\n    \"service\": \"billing-api\",\n    \"message\": \"Charge retried\",\n    \"context\": { \"orderId\": \"ORD-4471\" }\n  }'",
          "response": {
            "status": "201",
            "body": "{\n  \"id\": \"log_a03f77\",\n  \"level\": \"WARN\",\n  \"service\": \"billing-api\",\n  \"traceId\": \"d41f0b92\",\n  \"createdAt\": \"2026-08-09T09:14:31Z\"\n}"
          },
          "statuses": [
            { "code": "201", "description": "Event created" },
            { "code": "422", "description": "Required fields missing" },
            { "code": "413", "description": "Batch larger than 500 items" }
          ]
        },
        {
          "method": "PUT",
          "path": "/api/v1/logs/{id}",
          "summary": "Replaces the editable content of an event and records the revision",
          "notice": { "tone": "warn", "title": "Audited operation.", "text": "Allowed only on events younger than 24 h and requires the logs:write role. The previous value is kept in the revision history." },
          "body": [
            { "name": "message", "type": "string", "required": true, "description": "New event description" },
            { "name": "level", "type": "enum", "required": false, "description": "Severity reclassification" },
            { "name": "reviewNote", "type": "string", "required": true, "description": "Reason for the change, stored in the audit trail" }
          ],
          "request": "curl -X PUT '$BASE/api/v1/logs/log_8f21c4' \\\n  -H 'Authorization: Bearer $TOKEN' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"message\": \"Gateway timeout — incident INC-207\",\n    \"level\": \"FATAL\",\n    \"reviewNote\": \"Reclassified by on-call\"\n  }'",
          "response": {
            "status": "200",
            "body": "{\n  \"id\": \"log_8f21c4\",\n  \"level\": \"FATAL\",\n  \"message\": \"Gateway timeout — incident INC-207\",\n  \"revision\": 2,\n  \"updatedBy\": \"u_1180\",\n  \"updatedAt\": \"2026-08-09T09:31:02Z\"\n}"
          },
          "statuses": [
            { "code": "200", "description": "Event updated" },
            { "code": "403", "description": "Missing logs:write role" },
            { "code": "409", "description": "Event older than 24 h" }
          ]
        },
        {
          "method": "DELETE",
          "path": "/api/v1/logs/{id}",
          "summary": "Soft-deletes the event; permanent purge after 30 days",
          "notice": { "tone": "danger", "title": "Irreversible after 30 days.", "text": "Requires the logs:admin role. During the retention window the event can be restored from the audit console." },
          "params": [
            { "name": "id", "in": "path", "type": "string", "required": true, "description": "Identifier of the log to delete" },
            { "name": "reason", "in": "query", "type": "string", "required": true, "description": "Justification stored in the audit trail" }
          ],
          "request": "curl -X DELETE \\\n  '$BASE/api/v1/logs/log_8f21c4?reason=sensitive-data' \\\n  -H 'Authorization: Bearer $TOKEN'",
          "response": { "status": "204", "body": "204 No Content\n(no response body)" },
          "statuses": [
            { "code": "204", "description": "Deleted successfully" },
            { "code": "403", "description": "Missing logs:admin role" },
            { "code": "404", "description": "Event does not exist" }
          ]
        }
      ]
    }
  ]
}
</script>

<script>
(function () {
  var raw = document.getElementById('controllers-data').textContent;
  var DATA;
  try {
    DATA = JSON.parse(raw);
  } catch (err) {
    document.getElementById('app').innerHTML =
      '<div style="font-family:system-ui,sans-serif;max-width:900px;margin:48px auto;padding:20px 22px;'
      + 'border:1px solid #fecaca;border-left:4px solid #dc2626;border-radius:8px;background:#fef2f2;color:#7f1d1d">'
      + '<b>Invalid controllers JSON.</b> The block <code>#controllers-data</code> could not be parsed, so nothing can be rendered.'
      + '<pre style="margin:12px 0 0;font-size:12.5px;white-space:pre-wrap">' + String(err.message).replace(/</g, '&lt;') + '</pre></div>';
    return;
  }
  var SANS = "'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif";
  var MONO = "'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace";

  var THEMES = {
    light: {
      page: '#ffffff', card: '#ffffff', panel: '#fcfdfe', hover: '#fafcfb', chip: '#f8fafc', inlineCode: '#f1f5f9',
      ink: '#0f172a', body: '#475569', muted: '#64748b', faint: '#94a3b8',
      border: '#e2e8f0', hair: '#e6ebf0', rule: '#f1f5f9',
      accent: '#0e9f6e', accentText: '#047857', accentBg: '#ecfdf5', accentBorder: '#a7f3d0',
      codeBg: '#0b1220', codeFg: '#e2e8f0', codeDim: '#94a3b8',
      dot: { ok: '#0e9f6e', warn: '#f59e0b', error: '#dc2626' },
      method: {
        GET:    { fg: '#047857', bg: '#ecfdf5', bd: '#a7f3d0' },
        POST:   { fg: '#2563eb', bg: '#eff6ff', bd: '#bfdbfe' },
        PUT:    { fg: '#b45309', bg: '#fffbeb', bd: '#fde68a' },
        PATCH:  { fg: '#7c3aed', bg: '#f5f3ff', bd: '#ddd6fe' },
        DELETE: { fg: '#dc2626', bg: '#fef2f2', bd: '#fecaca' }
      },
      notice: {
        warn:   { bg: '#fffdf5', bd: '#fde68a', bar: '#f59e0b', fg: '#78350f' },
        danger: { bg: '#fef6f6', bd: '#fecaca', bar: '#dc2626', fg: '#7f1d1d' },
        info:   { bg: '#f6fdfa', bd: '#a7f3d0', bar: '#0e9f6e', fg: '#065f46' }
      }
    },
    dark: {
      page: '#0d1117', card: '#131a22', panel: '#10161d', hover: '#1a222c', chip: '#171f28', inlineCode: '#1b232d',
      ink: '#e6edf3', body: '#a3b2c0', muted: '#8b9aa9', faint: '#6f8092',
      border: '#232c37', hair: '#232c37', rule: '#212a34',
      accent: '#34d399', accentText: '#34d399', accentBg: '#0c2b21', accentBorder: '#1f6b4d',
      codeBg: '#07101a', codeFg: '#d5e0ea', codeDim: '#6f8092',
      dot: { ok: '#34d399', warn: '#f59e0b', error: '#f87171' },
      method: {
        GET:    { fg: '#34d399', bg: '#0c2b21', bd: '#1f6b4d' },
        POST:   { fg: '#60a5fa', bg: '#0e2136', bd: '#1e4c7d' },
        PUT:    { fg: '#fbbf24', bg: '#2b2211', bd: '#7a5f24' },
        PATCH:  { fg: '#c4b5fd', bg: '#1d1733', bd: '#4c3d8a' },
        DELETE: { fg: '#f87171', bg: '#2b1515', bd: '#7d2f2f' }
      },
      notice: {
        warn:   { bg: '#231c0e', bd: '#7a5f24', bar: '#f59e0b', fg: '#fcd34d' },
        danger: { bg: '#251414', bd: '#7d2f2f', bar: '#f87171', fg: '#fca5a5' },
        info:   { bg: '#0c2b21', bd: '#1f6b4d', bar: '#34d399', fg: '#6ee7b7' }
      }
    }
  };

  var PRISTINE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  function detectTheme() {
    var mode = document.documentElement.dataset.colorMode;
    if (mode === 'dark' || mode === 'light') return mode;
    try {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
    } catch (e) {}
    return 'light';
  }

  var theme = detectTheme();
  var open = {};

  function downloadHtml() {
    var name = ((DATA.meta && DATA.meta.title) || (DATA.controllers && DATA.controllers[0] && DATA.controllers[0].name) || 'api-reference')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    var blob = new Blob([PRISTINE_HTML], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name + '.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function toneOf(st) {
    if (st.tone) return st.tone;
    var c = parseInt(st.code, 10);
    if (c >= 500) return 'error';
    if (c >= 400) return 'warn';
    return 'ok';
  }
  function label(t, txt) {
    return '<h3 style="margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:' + t.accent + '">' + esc(txt) + '</h3>';
  }
  function th(t, txt, pad) {
    return '<th style="text-align:left;padding:' + pad + ';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:' + t.faint + ';border-bottom:1px solid ' + t.hair + '">' + esc(txt) + '</th>';
  }

  function paramTable(t, rows, kind) {
    var head = '<thead><tr>' + th(t, 'Name', '8px 12px 8px 0') + th(t, 'Type', '8px 12px') + th(t, 'Req.', '8px 12px') + th(t, 'Description', '8px 0 8px 12px') + '</tr></thead>';
    var body = rows.map(function (r, i) {
      var last = i === rows.length - 1;
      var bb = last ? 'none' : '1px solid ' + t.rule;
      var type = (kind === 'params' && r['in'] ? r['in'] + ' · ' : '') + (r.type || '');
      var req = r.required
        ? '<span style="color:' + t.accentText + ';font-size:12px;font-weight:600">Yes</span>'
        : '<span style="color:' + t.faint + ';font-size:12px">No</span>';
      return '<tr>'
        + '<td style="padding:11px 12px 11px 0;border-bottom:' + bb + ';font-family:' + MONO + ';color:' + t.ink + ';width:22%">' + esc(r.name) + '</td>'
        + '<td style="padding:11px 12px;border-bottom:' + bb + ';font-family:' + MONO + ';font-size:12.5px;color:' + t.muted + ';width:18%">' + esc(type) + '</td>'
        + '<td style="padding:11px 12px;border-bottom:' + bb + ';width:9%">' + req + '</td>'
        + '<td style="padding:11px 0 11px 12px;border-bottom:' + bb + ';color:' + t.body + '">' + esc(r.description) + '</td>'
        + '</tr>';
    }).join('');
    return '<table style="width:100%;font-size:13.5px">' + head + '<tbody>' + body + '</tbody></table>';
  }

  function codeBlock(t, txt, dim) {
    return '<pre style="background:' + t.codeBg + ';color:' + (dim ? t.codeDim : t.codeFg) + ';border-radius:10px;padding:16px;font-family:' + MONO + ';font-size:12.5px;line-height:1.7;overflow-x:auto">' + esc(txt) + '</pre>';
  }

  function statusList(t, statuses) {
    var items = statuses.map(function (st) {
      var dot = t.dot[toneOf(st)] || t.dot.warn;
      return '<div style="display:grid;grid-template-columns:9px 44px 1fr;align-items:baseline;gap:14px;padding:10px 2px;border-top:1px solid ' + t.rule + ';font-size:13px;line-height:1.5;color:' + t.body + '">'
        + '<span style="width:9px;height:9px;border-radius:2px;background:' + dot + ';display:inline-block;transform:translateY(1px)"></span>'
        + '<b style="font-family:' + MONO + ';font-size:13px;font-weight:600;color:' + t.ink + '">' + esc(st.code) + '</b>'
        + '<span>' + esc(st.description) + '</span></div>';
    }).join('');
    return '<div style="display:flex;flex-direction:column;border-bottom:1px solid ' + t.hair + '">' + items + '</div>';
  }

  function noticeBlock(t, n) {
    var s = t.notice[n.tone] || t.notice.info;
    return '<div style="display:flex;gap:12px;background:' + s.bg + ';border:1px solid ' + s.bd + ';border-left:4px solid ' + s.bar + ';border-radius:8px;padding:13px 15px">'
      + '<span style="font-size:13px;line-height:1.6;color:' + s.fg + '"><b>' + esc(n.title || '') + '</b> ' + esc(n.text || '') + '</span></div>';
  }

  function endpointCard(t, ep, key) {
    var m = t.method[String(ep.method).toUpperCase()] || t.method.GET;
    var isOpen = !!open[key];
    var head = '<div data-toggle="' + key + '" style="display:grid;grid-template-columns:82px 1fr auto;align-items:center;gap:16px;padding:16px 18px;cursor:pointer;background:' + (isOpen ? t.hover : t.card) + '">'
      + '<span style="display:inline-flex;align-items:center;justify-content:center;background:' + m.bg + ';color:' + m.fg + ';border:1px solid ' + m.bd + ';border-radius:6px;padding:5px 0;font-family:' + MONO + ';font-size:11.5px;font-weight:600;letter-spacing:.03em">' + esc(String(ep.method).toUpperCase()) + '</span>'
      + '<div style="display:flex;flex-direction:column;gap:4px;min-width:0">'
      + '<code style="font-family:' + MONO + ';font-size:15px;font-weight:500;color:' + t.ink + '">' + esc(ep.path) + '</code>'
      + '<span style="font-size:13px;color:' + t.muted + '">' + esc(ep.summary || '') + '</span></div>'
      + '<span style="font-size:20px;color:' + t.faint + ';line-height:1">' + (isOpen ? '\u2212' : '+') + '</span></div>';

    if (!isOpen) return '<section style="border:1px solid ' + t.border + ';border-radius:12px;overflow:hidden;background:' + t.card + '">' + head + '</section>';

    var parts = [];
    if (ep.notice) parts.push(noticeBlock(t, ep.notice));
    if (ep.params && ep.params.length) {
      parts.push('<div style="display:flex;flex-direction:column;gap:12px">' + label(t, 'Parameters') + paramTable(t, ep.params, 'params') + '</div>');
    }
    if (ep.body && ep.body.length) {
      parts.push('<div style="display:flex;flex-direction:column;gap:12px">' + label(t, 'Body · application/json') + paramTable(t, ep.body, 'body') + '</div>');
    }
    if (ep.request || ep.response) {
      var cols = '';
      if (ep.request) cols += '<div style="display:flex;flex-direction:column;gap:10px;min-width:0">' + label(t, 'Example request') + codeBlock(t, ep.request) + '</div>';
      if (ep.response) cols += '<div style="display:flex;flex-direction:column;gap:10px;min-width:0">' + label(t, (ep.response.status || '') + ' · Response') + codeBlock(t, ep.response.body, /^204/.test(String(ep.response.status))) + '</div>';
      parts.push('<div class="api-two-col" style="display:grid;grid-template-columns:' + (ep.request && ep.response ? '1fr 1fr' : '1fr') + ';gap:18px">' + cols + '</div>');
    }
    if (ep.statuses && ep.statuses.length) {
      parts.push('<div style="display:flex;flex-direction:column;gap:10px">' + label(t, 'Status codes') + statusList(t, ep.statuses) + '</div>');
    }

    return '<section style="border:1px solid ' + t.border + ';border-radius:12px;overflow:hidden;background:' + t.card + '">' + head
      + '<div style="border-top:1px solid ' + t.rule + ';padding:22px 18px;display:flex;flex-direction:column;gap:26px;background:' + t.panel + '">'
      + parts.join('') + '</div></section>';
  }

  function controllerBlock(t, c, ci) {
    var badges = (c.badges || []).map(function (b) {
      return '<span style="font-size:12px;font-weight:500;color:' + t.body + ';background:' + t.chip + ';border:1px solid ' + t.border + ';border-radius:6px;padding:5px 10px">' + esc(b) + '</span>';
    }).join('');
    var eps = (c.endpoints || []).map(function (ep, ei) { return endpointCard(t, ep, ci + '-' + ei); }).join('');
    var allOpen = (c.endpoints || []).every(function (ep, ei) { return open[ci + '-' + ei]; });

    return '<div style="padding-top:8px">'
      + '<div style="display:flex;flex-direction:column;gap:14px;padding-bottom:24px;border-bottom:1px solid ' + t.hair + '">'
      + '<div style="display:flex;align-items:center;gap:10px">'
      + '<span style="display:inline-flex;align-items:center;gap:7px;background:' + t.accentBg + ';color:' + t.accentText + ';border:1px solid ' + t.accentBorder + ';border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;letter-spacing:.02em">'
      + '<span style="width:6px;height:6px;border-radius:999px;background:' + t.accent + ';display:inline-block"></span>REST API · ' + esc((DATA.meta && DATA.meta.version) || 'v1') + '</span>'
      + ((DATA.meta && DATA.meta.updated) ? '<span style="font-size:12px;color:' + t.muted + ';font-weight:500">Updated ' + esc(DATA.meta.updated) + '</span>' : '')
      + '</div>'
      + '<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">'
      + '<h1 style="margin:0;font-size:40px;line-height:1.05;font-weight:700;letter-spacing:-.025em;color:' + t.ink + '">' + esc(c.name) + '</h1>'
      + (c.basePath ? '<code style="font-family:' + MONO + ';font-size:14px;color:' + t.ink + ';background:' + t.inlineCode + ';border:1px solid ' + t.border + ';border-radius:6px;padding:4px 9px">' + esc(c.basePath) + '</code>' : '')
      + '</div>'
      + (c.description ? '<p style="margin:0;max-width:68ch;font-size:16px;line-height:1.65;color:' + t.body + ';text-wrap:pretty">' + esc(c.description) + '</p>' : '')
      + (badges ? '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px">' + badges + '</div>' : '')
      + '</div>'
      + '<div style="display:flex;align-items:center;justify-content:flex-end;padding:18px 0 22px">'
      + '<button data-expand="' + ci + '" data-all-open="' + (allOpen ? '1' : '0') + '" style="border:1px solid ' + t.accent + ';background:transparent;color:' + t.accentText + ';border-radius:8px;padding:8px 14px;font-family:' + SANS + ';font-size:13px;font-weight:600;cursor:pointer">' + (allOpen ? 'Collapse all' : 'Expand all') + '</button></div>'
      + '<div style="display:flex;flex-direction:column;gap:14px">' + eps + '</div></div>';
  }

  function render() {
    var t = THEMES[theme];
    var app = document.getElementById('app');
    document.body.style.background = t.page;
    var controllers = (DATA.controllers || []).map(function (c, ci) { return controllerBlock(t, c, ci); })
      .join('<div style="height:56px"></div>');

    app.innerHTML = '<div style="font-family:' + SANS + ';color:' + t.ink + ';background:' + t.page + ';padding:28px 28px 64px;max-width:1040px;margin:0 auto">'
      + '<div style="display:flex;justify-content:flex-end;padding-bottom:4px">'
      + '<button id="download-html" title="Download this page as a standalone HTML file" style="display:inline-flex;align-items:center;gap:7px;border:1px solid ' + t.border + ';background:transparent;color:' + t.muted + ';border-radius:8px;padding:6px 12px;font-family:' + SANS + ';font-size:12px;font-weight:600;cursor:pointer">'
      + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 11 5 5 5-5"></path><path d="M4 20h16"></path></svg>'
      + 'Download HTML</button></div>'
      + controllers
      + '<div style="margin-top:34px;padding-top:22px;border-top:1px solid ' + t.hair + ';display:flex;flex-wrap:wrap;gap:26px;font-size:13px;color:' + t.muted + '">'
      + '<span>Common error model: <code style="font-family:' + MONO + ';background:' + t.inlineCode + ';border:1px solid ' + t.border + ';border-radius:5px;padding:2px 6px;color:' + t.ink + '">{ "code", "message", "traceId" }</code></span>'
      + '</div></div>';
  }

  document.addEventListener('click', function (e) {
    var toggle = e.target.closest('[data-toggle]');
    if (toggle) { var k = toggle.getAttribute('data-toggle'); open[k] = !open[k]; render(); return; }
    var expand = e.target.closest('[data-expand]');
    if (expand) {
      var ci = expand.getAttribute('data-expand');
      var next = expand.getAttribute('data-all-open') !== '1';
      ((DATA.controllers[ci] || {}).endpoints || []).forEach(function (ep, ei) { open[ci + '-' + ei] = next; });
      render(); return;
    }
    if (e.target.closest('#download-html')) { downloadHtml(); }
  });

  function syncTheme() {
    var next = detectTheme();
    if (next !== theme) { theme = next; render(); }
  }
  new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-color-mode'] });
  try {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', syncTheme);
    else if (mq.addListener) mq.addListener(syncTheme);
  } catch (e) {}

  (DATA.controllers || []).forEach(function (c, ci) { if (ci === 0) open['0-0'] = true; });
  render();
})();
</script>
</body>
</html>
